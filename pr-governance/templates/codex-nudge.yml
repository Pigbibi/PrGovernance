name: Review request

# Copy to .github/workflows/codex-nudge.yml and replace __GOVERNANCE_REPO__.
# Requests whichever of Codex and Claude is enabled. Set the repository or org
# variables CODEX_REVIEW_ENABLED and CLAUDE_REVIEW_ENABLED to true or false.
# Empty means Codex on and Claude off. When neither remains, the workflow posts
# GOVERNANCE_API_REVIEW_MENTION once so the DeepSeek reviewer starts.
# Cursor and Bugbot are not requested.
# Optional org var GOVERNANCE_REVIEWERS_JSON overrides reviewer identities.

on:
  schedule:
    - cron: '*/20 * * * *'
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  # createComment on a pull request needs pull-requests:write; issues:write
  # alone returns 403 Resource not accessible by integration.
  pull-requests: write
  issues: write

concurrency:
  group: review-request
  cancel-in-progress: false

jobs:
  nudge:
    name: Request a review
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       github.event.comment.user.type == 'Bot' &&
       github.event.comment.user.login != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request
        uses: __GOVERNANCE_REPO__/pr-governance@__GOVERNANCE_SHA__
        env:
          GOVERNANCE_REVIEWERS_JSON: ${{ vars.GOVERNANCE_REVIEWERS_JSON }}
          GOVERNANCE_DISPATCH_MENTIONS_JSON: ${{ vars.GOVERNANCE_DISPATCH_MENTIONS_JSON }}
          CODEX_REVIEW_ENABLED: ${{ vars.CODEX_REVIEW_ENABLED }}
          CLAUDE_REVIEW_ENABLED: ${{ vars.CLAUDE_REVIEW_ENABLED }}
          GOVERNANCE_API_REVIEW_MENTION: ${{ vars.GOVERNANCE_API_REVIEW_MENTION }}
        with:
          mode: nudge
